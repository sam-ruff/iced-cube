name: Release

# CI dispatches this once main passes. crates.io trusted publishing refuses workflow_run
# triggers, so the release cannot simply follow CI.
on:
  workflow_dispatch:
    inputs:
      sha:
        description: The main commit CI tested
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, sophie]
    timeout-minutes: 30
    environment: crates-io
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Only release the commit CI tested
        run: |
          if [ "$(git rev-parse HEAD)" != "$TESTED" ]; then
            echo "main has moved on since the tested commit; a later CI run will release it."
            echo "skip=true" >> "$GITHUB_ENV"
          fi
        env:
          TESTED: ${{ inputs.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: env.skip != 'true'
        with:
          node-version: 24
      - name: Toolchain
        if: env.skip != 'true'
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Install release tooling
        if: env.skip != 'true'
        run: npm ci
      - name: Check for a pending release
        if: env.skip != 'true'
        run: |
          set -o pipefail
          npx semantic-release --dry-run | tee dry-run.log
          if grep -q "The next release version is" dry-run.log; then
            echo "release=true" >> "$GITHUB_ENV"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: crates.io token
        if: env.skip != 'true' && env.release == 'true'
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - name: Semantic release
        if: env.skip != 'true' && env.release == 'true'
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
      - name: Released tag
        id: tag
        if: env.skip != 'true' && env.release == 'true'
        run: echo "tag=$(git describe --tags --exact-match HEAD)" >> "$GITHUB_OUTPUT"

  demo:
    name: Desktop demo
    needs: release
    if: needs.release.outputs.tag != ''
    permissions:
      contents: write
    uses: ./.github/workflows/demo.yml
    with:
      tag: ${{ needs.release.outputs.tag }}
