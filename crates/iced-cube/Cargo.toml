[package]
name = "iced-cube"
version = "0.0.4"
description = "Themeable application components for the iced GUI library, with Lucide icons"
readme = "README.md"
keywords = ["iced", "gui", "components", "ui", "widgets"]
categories = ["gui"]
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage = "https://sam-ruff.github.io/iced-cube/"
documentation = "https://docs.rs/iced-cube"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["x11", "wayland", "thread-pool", "full"]
x11 = ["iced/x11"]
wayland = ["iced/wayland"]
thread-pool = ["iced/thread-pool"]
tokio = ["iced/tokio"]

full = [
    "primitives",
    "forms",
    "layout",
    "navigation",
    "overlay",
    "feedback",
    "application",
    "data",
]

primitives = [
    "button",
    "icon-button",
    "input",
    "checkbox",
    "radio",
    "switch",
    "slider",
    "scroll-area",
    "separator",
    "toggle",
    "toggle-group",
]
forms = ["combobox", "field", "select", "textarea"]
layout = ["card", "stack", "accordion", "resizable-panel", "split-pane"]
navigation = ["breadcrumb", "command", "pagination", "tabs", "sidebar", "document-tabs"]
overlay = ["tooltip", "toast", "dialog", "popover", "dropdown-menu", "context-menu"]
feedback = ["alert", "avatar", "badge", "progress", "spinner"]
application = ["menubar", "toolbar", "status-bar", "command-palette"]
data = ["tree", "data-table", "json-viewer", "log-viewer", "property-grid", "virtual-list"]

button = ["iced/advanced"]
icon-button = ["button", "tooltip"]
input = []
checkbox = []
radio = []
switch = []
slider = ["iced/advanced", "dep:num-traits"]
scroll-area = []
separator = []
toggle = ["iced/advanced"]
toggle-group = ["toggle"]
combobox = ["input", "iced/advanced"]
field = []
select = ["iced/advanced"]
textarea = ["input"]
card = []
stack = []
accordion = []
resizable-panel = ["iced/advanced"]
split-pane = ["resizable-panel"]
breadcrumb = []
command = ["iced/advanced"]
pagination = ["button"]
tabs = ["iced/advanced"]
sidebar = ["iced/advanced", "tooltip", "icon-button"]
document-tabs = ["iced/advanced", "context-menu", "dropdown-menu", "icon-button"]
tooltip = []
toast = ["button", "icon-button"]
dialog = ["button", "icon-button", "iced/advanced"]
popover = ["iced/advanced"]
dropdown-menu = ["iced/advanced"]
context-menu = ["dropdown-menu"]
alert = []
avatar = ["iced/advanced", "iced/image-without-codecs"]
badge = ["iced/advanced"]
progress = []
spinner = ["iced/advanced"]
menubar = ["dropdown-menu"]
toolbar = ["icon-button", "dropdown-menu", "separator"]
status-bar = ["button", "badge", "progress", "spinner", "tooltip"]
command-palette = ["command", "dialog", "button"]
tree = ["iced/advanced", "badge", "checkbox", "context-menu", "scroll-area"]
data-table = [
    "iced/advanced",
    "badge",
    "button",
    "checkbox",
    "context-menu",
    "icon-button",
    "input",
    "scroll-area",
    "select",
]
json-viewer = [
    "iced/advanced",
    "alert",
    "context-menu",
    "icon-button",
    "input",
    "scroll-area",
    "dep:serde_json",
]
property-grid = [
    "iced/advanced",
    "checkbox",
    "icon-button",
    "input",
    "scroll-area",
    "select",
    "switch",
    "tooltip",
]
virtual-list = ["iced/advanced", "context-menu", "scroll-area"]
log-viewer = ["virtual-list", "button", "context-menu", "icon-button", "input", "toggle-group"]

[dependencies]
iced = { version = "0.14.0", default-features = false, features = ["svg"] }
lucide-static-svg = "1.48.0"
num-traits = { version = "0.2.19", optional = true }
serde_json = { version = "1.0.154", optional = true, features = ["preserve_order"] }

[dev-dependencies]
futures = "0.3.34"
iced = { version = "0.14.0", default-features = false, features = ["svg", "advanced", "tiny-skia"] }
iced_test = "0.14.0"
png = "0.18.1"

[lints]
workspace = true
